<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交工单</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    .required::after {
      content: " *";
      color: #e74c3c;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .category-input-wrapper {
      position: relative;
    }

    .category-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 2px solid #e0e0e0;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 10;
    }

    .category-suggestions.show {
      display: block;
    }

    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
    }

    .suggestion-item:hover {
      background: #f5f5f5;
    }

    .priority-group {
      display: flex;
      gap: 12px;
    }

    .priority-option {
      flex: 1;
      position: relative;
    }

    .priority-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .priority-option label {
      display: block;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .priority-option input[type="radio"]:checked + label {
      border-color: #667eea;
      background: #667eea;
      color: white;
    }

    .file-upload {
      border: 2px dashed #c0c0c0;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .file-upload:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .file-upload-text {
      color: #666;
      font-size: 14px;
    }

    .file-upload-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .file-list {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .success-message {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-message.show {
      display: block;
    }

    .success-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .success-message h2 {
      color: #333;
      margin-bottom: 8px;
    }

    .success-message p {
      color: #666;
    }

    .success-message .ticket-no {
      font-family: monospace;
      background: #f5f5f5;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 12px;
      font-size: 18px;
      color: #667eea;
      font-weight: 600;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-spinner {
      background: white;
      padding: 32px;
      border-radius: 12px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px;
      }

      .priority-group {
        flex-wrap: wrap;
      }

      .priority-option {
        flex: 1 1 calc(50% - 6px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="formSection">
      <h1>提交工单</h1>
      <p class="subtitle">请填写以下信息，我们会尽快处理您的请求</p>

      <div id="errorMessage" class="error-message"></div>

      <form id="ticketForm">
        <div class="form-group">
          <label class="required" for="title">工单标题</label>
          <input type="text" id="title" name="title" placeholder="简要描述您的问题" required>
        </div>

        <div class="form-group">
          <label class="required" for="description">问题描述</label>
          <textarea id="description" name="description" placeholder="请详细描述您遇到的问题或需求..." required></textarea>
        </div>

        <div class="form-group">
          <label class="required" for="category">分类</label>
          <div class="category-input-wrapper">
            <input type="text" id="category" name="category" placeholder="输入或选择分类" required autocomplete="off">
            <div id="categorySuggestions" class="category-suggestions"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="required">优先级</label>
          <div class="priority-group">
            <div class="priority-option">
              <input type="radio" id="priority-p0" name="priority" value="P0-紧急">
              <label for="priority-p0">P0 紧急</label>
            </div>
            <div class="priority-option">
              <input type="radio" id="priority-p1" name="priority" value="P1-高">
              <label for="priority-p1">P1 高</label>
            </div>
            <div class="priority-option">
              <input type="radio" id="priority-p2" name="priority" value="P2-中" checked>
              <label for="priority-p2">P2 中</label>
            </div>
            <div class="priority-option">
              <input type="radio" id="priority-p3" name="priority" value="P3-低">
              <label for="priority-p3">P3 低</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">联系邮箱</label>
          <input type="email" id="email" name="email" placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="contact">联系方式（选填）</label>
          <input type="text" id="contact" name="contact" placeholder="手机号或其他联系方式">
        </div>

        <div class="form-group">
          <label for="attachments">附件上传</label>
          <div class="file-upload" id="fileUploadArea">
            <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt">
            <div class="file-upload-icon">📎</div>
            <div class="file-upload-text">点击或拖拽文件到此处上传</div>
            <div class="file-list" id="fileList"></div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">提交工单</button>
      </form>
    </div>

    <div id="successSection" class="success-message">
      <div class="success-icon">✅</div>
      <h2>工单提交成功！</h2>
      <p>我们已收到您的工单，会尽快处理并回复您。</p>
      <div class="ticket-no" id="ticketNo"></div>
      <p style="margin-top: 20px; font-size: 13px; color: #999;">请保存此工单编号以便后续查询</p>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <div>提交中...</div>
    </div>
  </div>

  <script>
    // 初始化 Supabase
    const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.ANON_KEY);

    // 从 localStorage 读取历史分类
    let categoryHistory = JSON.parse(localStorage.getItem('categoryHistory') || '[]');
    let selectedFiles = [];

    const categoryInput = document.getElementById('category');
    const suggestionsDiv = document.getElementById('categorySuggestions');
    const fileUploadArea = document.getElementById('fileUploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const form = document.getElementById('ticketForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // 页面加载时从数据库获取分类历史
    async function loadCategoryHistory() {
      try {
        const { data, error } = await supabaseClient
          .from('category_history')
          .select('name')
          .order('usage_count', { ascending: false })
          .limit(20);

        if (error) throw error;

        if (data && data.length > 0) {
          categoryHistory = data.map(item => item.name);
          localStorage.setItem('categoryHistory', JSON.stringify(categoryHistory));
        } else {
          categoryHistory = ADMIN_CONFIG.DEFAULT_CATEGORIES;
        }
      } catch (err) {
        console.error('加载分类历史失败:', err);
        categoryHistory = ADMIN_CONFIG.DEFAULT_CATEGORIES;
      }
    }

    loadCategoryHistory();

    // 分类输入建议
    categoryInput.addEventListener('input', function() {
      const value = this.value.toLowerCase();
      let suggestions = [];

      if (value) {
        suggestions = categoryHistory.filter(cat =>
          cat.toLowerCase().includes(value)
        );
        if (suggestions.length < 5) {
          const moreSuggestions = ADMIN_CONFIG.DEFAULT_CATEGORIES.filter(cat =>
            cat.toLowerCase().includes(value) && !suggestions.includes(cat)
          );
          suggestions = [...suggestions, ...moreSuggestions];
        }
      } else {
        suggestions = [...categoryHistory];
      }

      if (suggestions.length > 0) {
        suggestionsDiv.innerHTML = suggestions.map(s =>
          `<div class="suggestion-item" data-value="${s}">${s}</div>`
        ).join('');
        suggestionsDiv.classList.add('show');
      } else {
        suggestionsDiv.classList.remove('show');
      }
    });

    // 点击建议项
    suggestionsDiv.addEventListener('click', function(e) {
      if (e.target.classList.contains('suggestion-item')) {
        categoryInput.value = e.target.dataset.value;
        suggestionsDiv.classList.remove('show');
      }
    });

    // 点击其他地方关闭建议
    document.addEventListener('click', function(e) {
      if (!categoryInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
        suggestionsDiv.classList.remove('show');
      }
    });

    // 文件上传
    fileUploadArea.addEventListener('click', () => fileInput.click());

    fileUploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileUploadArea.style.borderColor = '#667eea';
      fileUploadArea.style.background = '#f8f9ff';
    });

    fileUploadArea.addEventListener('dragleave', () => {
      fileUploadArea.style.borderColor = '#c0c0c0';
      fileUploadArea.style.background = '';
    });

    fileUploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      fileUploadArea.style.borderColor = '#c0c0c0';
      fileUploadArea.style.background = '';
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (let file of files) {
        if (selectedFiles.length >= UPLOAD_CONFIG.MAX_FILES) {
          showError(`最多只能上传 ${UPLOAD_CONFIG.MAX_FILES} 个文件`);
          break;
        }
        if (file.size > UPLOAD_CONFIG.MAX_FILE_SIZE) {
          showError(`文件 ${file.name} 超过 10MB 限制`);
          continue;
        }
        selectedFiles.push(file);
      }
      updateFileList();
    }

    function updateFileList() {
      if (selectedFiles.length === 0) {
        fileList.innerHTML = '';
        return;
      }
      fileList.innerHTML = selectedFiles.map((file, index) =>
        `<div class="file-item">
          <span>${file.name}</span>
          <span style="cursor: pointer; color: #c33;" onclick="removeFile(${index})">✕</span>
        </div>`
      ).join('');
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      updateFileList();
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }

    // 生成工单编号
    function generateTicketNo() {
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
      const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
      return `TK${dateStr}${random}`;
    }

    // 上传附件到 Supabase Storage
    async function uploadAttachments(ticketId) {
      const attachments = [];

      for (let file of selectedFiles) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${ticketId}/${Date.now()}.${fileExt}`;

        const { data, error } = await supabaseClient.storage
          .from('ticket-attachments')
          .upload(fileName, file);

        if (error) {
          console.error('上传文件失败:', error);
          continue;
        }

        // 获取公开 URL
        const { data: urlData } = supabaseClient.storage
          .from('ticket-attachments')
          .getPublicUrl(fileName);

        attachments.push({
          ticket_id: ticketId,
          file_name: file.name,
          file_path: urlData.publicUrl,
          file_size: file.size,
          file_type: file.type
        });
      }

      // 插入附件记录
      if (attachments.length > 0) {
        const { error } = await supabaseClient
          .from('attachments')
          .insert(attachments);

        if (error) {
          console.error('保存附件记录失败:', error);
        }
      }

      return attachments;
    }

    // 更新或插入分类历史
    async function updateCategoryHistory(category) {
      try {
        // 检查分类是否已存在
        const { data: existing, error } = await supabaseClient
          .from('category_history')
          .select('id, usage_count')
          .eq('name', category)
          .maybeSingle();

        if (error && error.code !== 'PGRST116') {
          console.error('查询分类失败:', error);
          return;
        }

        if (existing) {
          // 更新使用次数
          await supabaseClient
            .from('category_history')
            .update({ usage_count: existing.usage_count + 1 })
            .eq('id', existing.id);
        } else {
          // 插入新分类
          await supabaseClient
            .from('category_history')
            .insert({ name: category, usage_count: 1 });
        }
      } catch (err) {
        console.error('更新分类历史失败:', err);
      }
    }

    // 表单提交
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (SUPABASE_CONFIG.URL === 'YOUR_SUPABASE_URL_HERE') {
        showError('请先配置 Supabase（config.js）');
        return;
      }

      submitBtn.disabled = true;
      loadingOverlay.classList.add('show');

      // 调试：打印表单数据
      const formData = {
        ticket_no: generateTicketNo(),
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        priority: document.querySelector('input[name="priority"]:checked')?.value,
        contact_email: document.getElementById('email').value,
        contact_phone: document.getElementById('contact').value,
        status: '待处理'
      };
      console.log('提交工单数据:', formData);
      console.log('Supabase 配置:', SUPABASE_CONFIG.URL);

      // 验证必填字段
      if (!formData.title || !formData.description || !formData.category || !formData.priority) {
        showError('请填写所有必填字段（标题、描述、分类、优先级）');
        submitBtn.disabled = false;
        loadingOverlay.classList.remove('show');
        return;
      }

      try {
        const ticketNo = generateTicketNo();

        // 插入工单
        const { data: ticket, error: ticketError } = await supabaseClient
          .from('tickets')
          .insert([{
            ticket_no: ticketNo,
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            category: document.getElementById('category').value,
            priority: document.querySelector('input[name="priority"]:checked').value,
            contact_email: document.getElementById('email').value,
            contact_phone: document.getElementById('contact').value,
            status: '待处理'
          }])
          .select()
          .single();

        if (ticketError) throw ticketError;

        console.log('工单提交成功:', ticket);

        // 上传附件
        if (selectedFiles.length > 0) {
          await uploadAttachments(ticket.id);
        }

        // 更新分类历史
        await updateCategoryHistory(document.getElementById('category').value);

        // 保存分类到本地
        const category = document.getElementById('category').value;
        if (!categoryHistory.includes(category)) {
          categoryHistory.unshift(category);
          categoryHistory = categoryHistory.slice(0, 20);
          localStorage.setItem('categoryHistory', JSON.stringify(categoryHistory));
        }

        // 显示成功消息
        document.getElementById('ticketNo').textContent = ticketNo;
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('successSection').classList.add('show');

      } catch (error) {
        console.error('提交失败:', error);
        const errorMsg = error.message || '未知错误';
        const errorDetail = error.details || error.hint || '';
        showError('提交失败：' + errorMsg + (errorDetail ? '\n' + errorDetail : ''));
        submitBtn.disabled = false;
      } finally {
        loadingOverlay.classList.remove('show');
      }
    });
  </script>
</body>
</html>
